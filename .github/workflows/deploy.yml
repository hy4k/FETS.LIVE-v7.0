name: Deploy to VPS (fets.live)

# Deploy: SSH into VPS, pull latest in /opt/apps/fets-live, rebuild Docker.
# Site is served via Traefik → fets-live-app container.
#
# One-time setup — add these repo secrets (Settings → Secrets → Actions):
#   VPS_HOST     e.g. 72.61.171.192
#   VPS_USER     e.g. root
#   VPS_SSH_KEY  a private SSH key whose public key is in the server's
#                ~/.ssh/authorized_keys
#
# Until those secrets exist, the deploy step is skipped (workflow stays green).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy secrets are configured
        id: cfg
        run: echo "ready=${{ secrets.VPS_HOST != '' && secrets.VPS_SSH_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        if: steps.cfg.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /opt/apps/fets-live
            git fetch origin
            git checkout -f main
            git reset --hard origin/main
            docker compose build app
            docker compose up -d --force-recreate app
            echo ""
            echo "=== Verify deployed content ==="
            sleep 3
            # Check the index.html hash inside the running container
            docker compose exec app md5sum /usr/share/nginx/html/index.html 2>/dev/null || true
            # Check which JS chunks are referenced
            docker compose exec app grep -oP 'RedesignShell-[A-Za-z0-9]+' /usr/share/nginx/html/index.html 2>/dev/null || true
            docker compose exec app grep -oP 'index-[A-Za-z0-9]+' /usr/share/nginx/html/index.html 2>/dev/null || true

      - name: Note when skipped
        if: steps.cfg.outputs.ready != 'true'
        run: echo "VPS_HOST / VPS_SSH_KEY secrets not set — skipping deploy. Add them to enable auto-deploy."
